apiVersion: apps/v1
kind: Deployment
metadata:
  name: autobot
  labels:
    app: autobot
spec:
  # Chỉ 1 bản: phiên hội thoại, model TTS và WebSocket ESP32 nằm trong RAM của pod; PVC là ReadWriteOnce
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: autobot
  template:
    metadata:
      labels:
        app: autobot
    spec:
      imagePullSecrets:
        - name: acr-secret
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: autobot
          image: autobot   # registry + tag đặt trong overlay k8s/local/kustomization.yaml
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: autobot-env            # GEMINI_API_KEY, DXAI_* (tạo từ .env, xem DEPLOY_K3S.md)
          env:
            - name: PORT
              value: "8000"
            - name: AUTOBOT_DATA_DIR
              value: /data
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 250m
              memory: 1Gi       # đo thực tế: ~815MiB khi đã nạp VieNeu int8
            limits:
              cpu: "2"
              memory: 3Gi
          # Lần đầu bật giọng đọc VieNeu phải tải model trước khi uvicorn mở cổng -> cho tối đa 10 phút
          startupProbe:
            httpGet: { path: /api/state, port: http }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /api/state, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/state, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 4
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: autobot-data
